version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  universal_platform: ^1.1.0
  universal_ble: ^1.2.0
  trezor_usb_transport:
